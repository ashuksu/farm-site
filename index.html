<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Фермерская лавка</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="header" class="header">
    <div class="container">
        <h1 class="header__title">🌿 Фермерская лавка</h1>
        <p class="header__text">Свежие продукты каждый день</p>
    </div>
</header>

<main class="main">
    <div class="container">
        <div class="products" id="products"></div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div id="cart" class="cart">
            <span id="count">0 товаров</span>
            <span id="total">0 kr</span>
        </div>
    </div>
</footer>

<div id="cart-modal" class="cart-modal hidden" hidden>
    <div class="container">
        <div class="cart-content">
            <h2>Корзина</h2>

            <div id="cart-items"></div>

            <div class="cart-summary">
                <strong id="cart-total-modal">0 kr</strong>
            </div>

            <button id="buy-btn">Купить</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
