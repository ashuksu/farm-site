<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Farmer's Market</title>

    <link rel="stylesheet" href="styles/critical.css">
    <link rel="preload" href="styles/main.css" as="style" onload="this.rel='stylesheet'" fetchpriority="low">
    <noscript>
        <link rel="stylesheet" href="styles/main.css">
    </noscript>
    <link rel="preload" href="styles/pages/home.css" as="style" onload="this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="styles/pages/home.css">
    </noscript>
</head>

<body>

<header id="header" class="header">
    <div class="container">
        <div class="header__row">
            <a href="/" class="logo">
                <img src="./assets/images/logo.svg" alt="Logo">
            </a>
            <h1 class="header__title title-card">Farmer's Market</h1>
        </div>
        <p class="header__text">Fresh produce every day</p>
    </div>
</header>

<main class="main">
    <section id="main-banner" data-banner-bg-image class="main-banner">
        <div class="container">
            <div class="main-banner__inner">
                <p data-banner-title class="title-hero main-banner__title"></p>
                <p data-banner-text class="sub-title main-banner__text"></p>
<!--                <a href="#" data-banner-url data-banner-button class="button main-banner__button"></a>-->
            </div>
        </div>
    </section>

    <div class="container">
        <div id="products" class="products"></div>
    </div>
</main>

<footer id="footer" class="footer">
    <div class="container">
        <div id="cart" class="cart">
            <span id="count">0 products</span>
            <span id="total">0 kr</span>
        </div>
    </div>
</footer>

<div id="cart-modal" class="cart-modal hidden" hidden>
    <div class="container">
        <div class="cart-content">
            <button id="close-cart" class="modal-close">✕</button>
            <h2 class="modal-title">Cart</h2>

            <div class="cart-items-container">
                <div id="cart-items"></div>
                <div class="cart-summary">
                    <strong id="cart-total-modal">0 kr</strong>
                </div>
                <button id="cart-btn-buy" class="button button--primary">Buy</button>
            </div>


            <div hidden id="confirm-actions" class="confirm-actions">
                <p>Make a purchase?</p>
                <div class="action-block">
                    <button id="confirm-buy-btn-no" class="button button--accent">No</button>
                    <button id="confirm-buy-btn-yes" class="button button--primary">Yes</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
